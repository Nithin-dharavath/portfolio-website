{% extends "base.html" %}
{% block title %}Page Not Found | Nithin Dharavath{% endblock %}
{% block description %}The page you're looking for doesn't exist.{% endblock %}

{% block content %}
    <main class="error-page">
        <div class="container" style="text-align: center; padding: 160px 0 100px;">
            <h1 style="font-size: 6rem; color: var(--accent); margin-bottom: 0.5rem;">404</h1>
            <h2 style="margin-bottom: 1rem;">Page Not Found</h2>
            <p style="color: var(--text-muted); margin-bottom: 2rem;">The page you're looking for doesn't exist or has been moved.</p>
            <a href="/" class="btn btn-primary">Go Home</a>
        </div>
    </main>
{% endblock %}
